name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  codeql:
    name: GitHub CodeQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: javascript-typescript
          queries: security-extended,security-and-quality
      - name: Autobuild
        uses: github/codeql-action/autobuild@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: '/language:javascript-typescript'

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
      - name: Audit (fail on high+ severity, excluding accepted risks)
        run: |
          set -o pipefail
          # js-yaml GHSA-h67p-54hq-rp68, GHSA-52cp-r559-cp3m, GHSA-5p4m-2wfm-xmqj:
          # gray-matter@4.0.3 (unmaintained since ~2021) calls the removed
          # yaml.safeLoad/safeDump API, which only exists in js-yaml <4.0, so
          # the >=5.x fix can't be taken without breaking frontmatter parsing
          # site-wide. These are quadratic-complexity DoS via crafted YAML
          # aliases/merge keys; frontmatter here is developer-authored, not
          # attacker-controlled input, so the residual risk is accepted.
          # See PR #135 for the investigation.
          ACCEPTED_GHSAS="GHSA-h67p-54hq-rp68 GHSA-52cp-r559-cp3m GHSA-5p4m-2wfm-xmqj"
          npm audit --audit-level=high --omit=dev --json > audit.json || true
          UNACCEPTED=$(jq --arg accepted "$ACCEPTED_GHSAS" '
            [.vulnerabilities[]
              | select(.severity == "high" or .severity == "critical")
              | .via[] | select(type == "object") | .url // ""
              | capture("(?<id>GHSA-[a-z0-9-]+)").id]
            | unique
            | map(select(. as $id | ($accepted | split(" ") | index($id)) == null))
          ' audit.json)
          if [ "$(echo "$UNACCEPTED" | jq 'length')" != "0" ]; then
            echo "Unaccepted high/critical severity findings:"
            echo "$UNACCEPTED"
            npm audit --audit-level=high --omit=dev
            exit 1
          fi
          echo "Only accepted, documented findings present (or none) -- see comments above for rationale."

  snyk:
    name: Snyk
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Snyk test
        uses: snyk/actions/node@12140f4059e244892ae643824a95459a102120dd # master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --sarif-file-output=snyk.sarif
      - name: Upload Snyk SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: snyk.sarif
